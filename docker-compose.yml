version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://charanisubasinghe10:charanisubasinghe10@cluster0.uzj6i.mongodb.net/waterdb?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - mongo
    restart: always
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
  mongo:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: always